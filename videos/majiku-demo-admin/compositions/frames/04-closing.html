<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
      font-family: "Plus Jakarta Sans";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("assets/fonts/plus-jakarta-sans-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "Plus Jakarta Sans";
      font-style: normal;
      font-weight: 600;
      font-display: block;
      src: url("assets/fonts/plus-jakarta-sans-600.woff2") format("woff2");
    }
    @font-face {
      font-family: "Plus Jakarta Sans";
      font-style: normal;
      font-weight: 700;
      font-display: block;
      src: url("assets/fonts/plus-jakarta-sans-700.woff2") format("woff2");
    }
    @font-face {
      font-family: "Plus Jakarta Sans";
      font-style: italic;
      font-weight: 700;
      font-display: block;
      src: url("assets/fonts/plus-jakarta-sans-700-italic.woff2") format("woff2");
    }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FCFAF7; }

  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background-color: #FCFAF7;
    font-family: "Plus Jakarta Sans", sans-serif;
  }

  .f4-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .f4-dim {
    position: absolute;
    inset: 0;
    background: rgba(252, 250, 247, 0.62);
    backdrop-filter: blur(3px);
    opacity: 0;
  }

  .f4-card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 880px;
    padding: 64px 72px 56px;
    border-radius: 2rem;
    border: 3px solid #1E1E1E;
    background-color: #FFFFFF;
    box-shadow: 14px 14px 0 rgba(26, 26, 26, 0.10);
    text-align: center;
    opacity: 0;
    scale: 0.9;
  }

  .f4-lockup {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 14px;
  }

  .f4-mark {
    width: 56px;
    height: 56px;
    display: block;
  }

  .f4-wordmark {
    font-size: 58px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #32221B;
    line-height: 1;
  }

  .f4-tagline {
    font-size: 30px;
    font-weight: 600;
    line-height: 1.35;
    color: #32221B;
    margin-bottom: 8px;
  }

  .f4-tagline em {
    font-style: normal;
    background: linear-gradient(transparent 58%, #FCE292 58%);
  }

  .f4-accent {
    width: 80px;
    height: 5px;
    border-radius: 9999px;
    background-color: #F06542;
    margin: 22px auto 30px;
  }

  .f4-cta {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 22px 52px;
    border-radius: 9999px;
    border: 3px solid #1E1E1E;
    background-color: #F06542;
    color: #FFFFFF;
    font-size: 30px;
    font-weight: 700;
    box-shadow: 8px 8px 0 rgba(26, 26, 26, 0.12);
    opacity: 0;
    scale: 0.88;
  }

  .f4-note {
    margin-top: 22px;
    display: inline-block;
    padding: 10px 26px;
    border-radius: 9999px;
    border: 2.5px solid #1E1E1E;
    background-color: #FCE292;
    color: #32221B;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0;
    y: 14;
  }
</style>
</head>
<body>
  <div
    id="root"
    data-composition-id="04-closing"
    data-start="0"
    data-duration="9"
    data-width="1920"
    data-height="1080"
  >
    <video
      class="clip"
      src="assets/demo-s1.mp4"
      playsinline
      muted
      data-start="0"
      data-duration="9"
      data-track-index="1"
    ></video>

    <div class="f4-dim" id="f4-dim"></div>

    <div class="f4-card" id="f4-card">
      <div class="f4-lockup">
        <img class="f4-mark" src="assets/logo-65fc9c68.svg" alt="MAJIKU">
        <span class="f4-wordmark">MAJIKU</span>
      </div>
      <div class="f4-tagline">Kelola lembaga pendidikan Anda<br>dengan <em>lebih mudah</em>.</div>
      <div class="f4-accent" id="f4-accent"></div>
      <div class="f4-cta" id="f4-cta">
        <span>✦ Coba Gratis 14 Hari</span>
      </div>
      <div><span class="f4-note" id="f4-note">Tanpa kartu kredit · Setup 5 menit</span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Footage meredup saat VO menyebut MAJIKU
      tl.fromTo("#f4-dim", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.3);

      // Card lockup pop @0.4 pada "MAJIKU"
      tl.fromTo(
        "#f4-card",
        { opacity: 0, scale: 0.9, y: 24 },
        { opacity: 1, scale: 1, y: 0, duration: 0.65, ease: "power3.out" },
        0.4
      );

      // Accent line self-draw
      tl.fromTo(
        "#f4-accent",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" },
        1.7
      );

      // CTA spring pop @5.2 (setelah VO selesai) — smooth settle
      tl.fromTo(
        "#f4-cta",
        { opacity: 0, scale: 0.88, y: 18 },
        { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" },
        5.2
      );

      // Note pill pop @6.2
      tl.fromTo(
        "#f4-note",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        6.2
      );

      // HOLD sampai akhir
          window.__timelines = window.__timelines || {};
      window.__timelines["04-closing"] = tl;
    })();
  </script>
</body>
</html>
