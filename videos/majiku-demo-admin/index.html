<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="42.5"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-dashboard"
        class="scene"
        data-composition-id="01-dashboard"
        data-composition-src="compositions/frames/01-dashboard.html"
        data-start="0"
        data-duration="10"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-dashboard-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="9.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-feed"
        class="scene"
        data-composition-id="02-feed"
        data-composition-src="compositions/frames/02-feed.html"
        data-start="9.5"
        data-duration="12"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-feed-voice"
        src="assets/voice/02.wav"
        data-start="9.5"
        data-duration="11.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-approve"
        class="scene"
        data-composition-id="03-approve"
        data-composition-src="compositions/frames/03-approve.html"
        data-start="21"
        data-duration="13"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-approve-voice"
        src="assets/voice/03.wav"
        data-start="21"
        data-duration="12.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-closing"
        class="scene"
        data-composition-id="04-closing"
        data-composition-src="compositions/frames/04-closing.html"
        data-start="33.5"
        data-duration="9"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-closing-voice"
        src="assets/voice/04.wav"
        data-start="33.5"
        data-duration="9"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.wav"
        data-start="0"
        data-duration="42.5"
        data-track-index="11"
        data-volume="0.12"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="42.5"
        data-track-index="2"
      ></div>

      <!-- SFX -->
      <audio
        id="el-sfx-0"
        src="assets/sfx/ping.mp3"
        data-start="0"
        data-duration="1.32"
        data-track-index="20"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-1"
        src="assets/sfx/click-soft.mp3"
        data-start="9.5"
        data-duration="0.37"
        data-track-index="21"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-2"
        src="assets/sfx/notification.mp3"
        data-start="21"
        data-duration="2.46"
        data-track-index="22"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-3"
        src="assets/sfx/chime.mp3"
        data-start="33.5"
        data-duration="2.5"
        data-track-index="23"
        data-volume="0.35"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-dashboard", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 9.5);
        tl.fromTo("#el-02-feed", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 9.5);
        tl.to("#el-02-feed", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 21);
        tl.fromTo("#el-03-approve", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 21);
        tl.to("#el-03-approve", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 33.5);
        tl.fromTo("#el-04-closing", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 33.5);
        tl.to({}, { duration: 42.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
