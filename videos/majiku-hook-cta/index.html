<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="9"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-05-cta"
        class="scene"
        data-composition-id="05-cta"
        data-composition-src="compositions/frames/05-cta.html"
        data-start="0"
        data-duration="7"
        data-track-index="0"
      ></div>
      <audio
        id="el-05-cta-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="6.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-99-cta-card"
        class="scene"
        data-composition-id="99-cta-card"
        data-composition-src="compositions/frames/99-cta-card.html"
        data-start="6.5"
        data-duration="2.5"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.wav"
        data-start="0"
        data-duration="9"
        data-track-index="11"
        data-volume="0.14"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="9"
        data-track-index="2"
      ></div>

      <!-- SFX -->
      <audio
        id="el-sfx-0"
        src="assets/sfx/click.mp3"
        data-start="0"
        data-duration="0.37"
        data-track-index="20"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-1"
        src="assets/sfx/pop.mp3"
        data-start="0"
        data-duration="0.72"
        data-track-index="21"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-2"
        src="assets/sfx/chime.mp3"
        data-start="6.9"
        data-duration="1.2"
        data-track-index="22"
        data-volume="0.5"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-05-cta", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 6.5);
        tl.fromTo("#el-99-cta-card", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 6.5);
        tl.to({}, { duration: 9 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
