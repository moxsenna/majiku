  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Cache DOM references
      const lockup = document.getElementById("05-cta-lockup-pill");
      const mark = document.getElementById("05-cta-mark");
      const btn = document.getElementById("05-cta-btn");
      const supportPill = document.getElementById("05-cta-support-pill");
      const cursor = document.getElementById("05-cta-cursor");
      const ripple1 = document.getElementById("05-cta-ripple-1");
      const ripple2 = document.getElementById("05-cta-ripple-2");

      // Set initial states for deterministic frame-by-frame seeking
      gsap.set(lockup, { scale: 0, opacity: 0, y: -20 });
      gsap.set(mark, { scale: 1, opacity: 1, rotation: 0 });
      gsap.set(btn, { scale: 0.65, opacity: 0 });
      gsap.set(supportPill, { scale: 0, opacity: 0, rotation: -12, y: 28 });
      gsap.set(cursor, { x: 920, y: 1480, opacity: 0 });
      gsap.set(ripple1, { scale: 0, opacity: 0 });
      gsap.set(ripple2, { scale: 0, opacity: 0 });

      // Subtle float on wallpaper pills
      const wpPills = [
        document.getElementById("05-cta-wp-1"),
        document.getElementById("05-cta-wp-2"),
        document.getElementById("05-cta-wp-3"),
        document.getElementById("05-cta-wp-4"),
        document.getElementById("05-cta-wp-5"),
        document.getElementById("05-cta-wp-6"),
      ];
      wpPills.forEach((p, idx) => {
        if (!p) return;
        const drift = idx % 2 === 0 ? 6 : -6;
        tl.to(p, { y: drift, duration: 1.75, ease: "sine.inOut" }, 0.0);
        tl.to(p, { y: 0, duration: 1.75, ease: "sine.inOut" }, 1.75);
      });

      // =========================================================================
      // SCENE 1 (0.0–1.6s):
      // - 0.0–0.4s: Mark sparkle resting breath
      // - @0.2s: lockup mark+"MAJIKU" pop di atas (~28% tinggi)
      // - @0.6–1.2s: tombol CTA coral besar "Coba Gratis 14 Hari" scale-swap center
      // =========================================================================

      // Resting breath on center mark
      tl.to(mark, { rotation: 4, duration: 0.40, ease: "power1.inOut" }, 0.0);

      // Lockup pop di atas @0.2s
      tl.fromTo(
        lockup,
        { scale: 0, opacity: 0, y: -20 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.8)" },
        0.20
      );

      // Scale-swap transition: center mark condenses & shrinks out, CTA button scales in
      tl.to(
        mark,
        { scale: 0.65, opacity: 0, duration: 0.35, ease: "power2.in" },
        0.60
      );
      tl.fromTo(
        btn,
        { scale: 0.65, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.55, ease: "back.out(1.7)" },
        0.65
      );

      // =========================================================================
      // SCENE 2 (1.6–3.5s):
      // - Cursor arrives @1.48–1.80s
      // - kursor press-ripple klik@1.8s
      // - pill "Tanpa kartu kredit" (mint) pop@2.6s
      // - HOLD to 3.5s
      // =========================================================================

      // Cursor approach from lower-right to CTA button off-center point (620, 980)
      tl.to(cursor, { opacity: 1, duration: 0.10, ease: "power1.out" }, 1.48);
      tl.to(cursor, { x: 620, y: 980, duration: 0.32, ease: "power2.out" }, 1.48);

      // Click @1.80s: Lockstep press depression
      tl.to(
        [btn, cursor],
        { scale: 0.94, duration: 0.08, ease: "power1.in" },
        1.80
      );
      tl.to(
        btn,
        { boxShadow: "2px 2px 0 rgba(26, 26, 26, 0.08)", duration: 0.08, ease: "power1.in" },
        1.80
      );

      // Spring release with overshoot @1.88s
      tl.to(
        [btn, cursor],
        { scale: 1.0, duration: 0.34, ease: "back.out(1.8)" },
        1.88
      );
      tl.to(
        btn,
        { boxShadow: "8px 8px 0 rgba(26, 26, 26, 0.08)", duration: 0.34, ease: "power2.out" },
        1.88
      );

      // Expanding ripples from click point (620, 980)
      tl.set(ripple1, { opacity: 0.85 }, 1.80);
      tl.to(
        ripple1,
        { scale: 5.0, opacity: 0, duration: 0.65, ease: "power2.out", immediateRender: false },
        1.80
      );

      tl.set(ripple2, { opacity: 0.65 }, 1.88);
      tl.to(
        ripple2,
        { scale: 6.0, opacity: 0, duration: 0.70, ease: "power2.out", immediateRender: false },
        1.88
      );

      // Post-click subtle cursor drift
      tl.to(cursor, { x: 645, y: 995, duration: 0.45, ease: "power2.out" }, 2.22);

      // Pill "Tanpa kartu kredit" (mint) pop@2.6s
      tl.fromTo(
        supportPill,
        { scale: 0, opacity: 0, rotation: -12, y: 28 },
        { scale: 1.0, opacity: 1, rotation: 0, y: 0, duration: 0.55, ease: "back.out(1.6)" },
        2.60
      );

      // Total timeline span anchor (3.5s)
      tl.to({}, { duration: 3.5 }, 0);

      // Register timeline
      window.__timelines["05-cta"] = tl;
    })();
  </script>
