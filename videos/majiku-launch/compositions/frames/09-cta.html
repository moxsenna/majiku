    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Cache DOM references
      const mark = document.getElementById("09-cta-mark");
      const btn = document.getElementById("09-cta-btn");
      const cursor = document.getElementById("09-cta-cursor");
      const ripple1 = document.getElementById("09-cta-ripple-1");
      const ripple2 = document.getElementById("09-cta-ripple-2");
      const supportPill1 = document.getElementById("09-cta-support-pill-1");
      const supportPill2 = document.getElementById("09-cta-support-pill-2");
      const urlPill = document.getElementById("09-cta-url-pill");

      // Set initial states for deterministic frame-by-frame seeking
      gsap.set(mark, { scale: 1, opacity: 1, rotation: 0 });
      gsap.set(btn, { scale: 0.65, opacity: 0 });
      gsap.set(cursor, { x: 1720, y: 780, opacity: 0 });
      gsap.set(ripple1, { scale: 0, opacity: 0 });
      gsap.set(ripple2, { scale: 0, opacity: 0 });
      gsap.set(supportPill1, { scale: 0, opacity: 0, rotation: -16, y: 28 });
      gsap.set(supportPill2, { scale: 0, opacity: 0, rotation: 16, y: 28 });
      gsap.set(urlPill, { opacity: 0, y: 24 });

      // Subtle float on wallpaper pills
      const wallpaperPills = [
        document.getElementById("09-cta-wp-1"),
        document.getElementById("09-cta-wp-2"),
        document.getElementById("09-cta-wp-3"),
        document.getElementById("09-cta-wp-4"),
        document.getElementById("09-cta-wp-5"),
      ];
      wallpaperPills.forEach((p, idx) => {
        if (!p) return;
        const drift = idx % 2 === 0 ? 8 : -8;
        tl.to(p, { y: drift, duration: 3.0, ease: "sine.inOut" }, 0.0);
        tl.to(p, { y: 0, duration: 3.04, ease: "sine.inOut" }, 3.0);
      });

      // =========================================================================
      // SCENE 1 (0.0–2.7s): Mark sparkle at center -> scale-swap to CTA button
      //                     Cursor arrives from right @ 2.0s and clicks @ 2.4s
      // =========================================================================

      // 0.0–0.4s: Mark sparkle resting breath

      // 0.4–1.0s: Scale-swap transition (mark shrinks out, coral CTA expands in)

        mark,
        { scale: 0.65, opacity: 0, duration: 0.35, ease: "power2.in" },
        0.40
      );
      tl.fromTo(
        btn,
        { scale: 0.65, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.55, ease: "back.out(1.6)" },
        0.45
      );

      // 2.0s: Cursor decel-arrive from outer right, landing slightly off-center on CTA
      tl.to(cursor, { opacity: 1, duration: 0.12, ease: "power1.out" }, 2.00);
      tl.to(cursor, { x: 990, y: 460, duration: 0.40, ease: "power2.out" }, 2.00);

      // 2.4s: Click & press-ripple
      // Lockstep press depression
      tl.to(
        [btn, cursor],
        { scale: 0.94, duration: 0.08, ease: "power1.in" },
        2.40
      );
      tl.to(
        btn,
        { boxShadow: "2px 2px 0 rgba(26, 26, 26, 0.08)", duration: 0.08, ease: "power1.in" },
        2.40
      );

      // Spring release with overshoot
      tl.to(
        [btn, cursor],
        { scale: 1.0, duration: 0.32, ease: "back.out(1.8)" },
        2.48
      );
      tl.to(
        btn,
        { boxShadow: "7.7px 7.7px 0 rgba(26, 26, 26, 0.08)", duration: 0.32, ease: "power2.out" },
        2.48
      );

      // Expanding ripples from click point
      tl.set(ripple1, { opacity: 0.8 }, 2.40);
      tl.to(
        ripple1,
        { scale: 4.5, opacity: 0, duration: 0.65, ease: "power2.out", immediateRender: false },
        2.40
      );

      tl.set(ripple2, { opacity: 0.6 }, 2.48);
      tl.to(
        ripple2,
        { scale: 5.5, opacity: 0, duration: 0.70, ease: "power2.out", immediateRender: false },
        2.48
      );

      // Subtle post-click cursor drift
      tl.to(cursor, { x: 1015, y: 475, duration: 0.50, ease: "power2.out" }, 2.80);

      // =========================================================================
      // SCENE 2 (2.9–4.2s): Supporting pill "Tanpa kartu kredit" (mint) pop @ 2.9s
      // =========================================================================
