  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const card = document.getElementById("02-overwhelm-card");
      const wrap1 = document.getElementById("02-overwhelm-pill-wrap-1");
      const wrap2 = document.getElementById("02-overwhelm-pill-wrap-2");
      const wrap3 = document.getElementById("02-overwhelm-pill-wrap-3");
      const wrap4 = document.getElementById("02-overwhelm-pill-wrap-4");

      const pill1 = document.getElementById("02-overwhelm-pill-1");
      const pill2 = document.getElementById("02-overwhelm-pill-2");
      const pill3 = document.getElementById("02-overwhelm-pill-3");
      const pill4 = document.getElementById("02-overwhelm-pill-4");

      const vignette = document.getElementById("02-overwhelm-vignette");

      // Initial deterministic state at t=0
      tl.set([wrap1, wrap2, wrap3, wrap4], { x: 0, y: 0 }, 0);
      tl.set([pill1, pill2, pill3, pill4], { scale: 0, opacity: 0 }, 0);
      tl.set(vignette, { opacity: 0 }, 0);

      // Scene 1 (0.0-1.6s): Central card springs in softly @ 0.3s ("Setiap hari")
      // Visible by t <= 0.5s
      tl.fromTo(
        card,
        { scale: 0.82, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0.3
      );

      // Scene 2 (1.6-6.5s): Demand pills accumulate one by one around the card
      // "Buku absen" (clipboard) @ 2.0s
      tl.fromTo(
        pill1,
        { scale: 0, opacity: 0, rotation: 0 },
        { scale: 1.05, opacity: 1, rotation: -12, duration: 0.55, ease: "power3.out" },
        2.0
      );

      // "Data siswa" (users) @ 3.2s
      tl.fromTo(
        pill2,
        { scale: 0, opacity: 0, rotation: 0 },
        { scale: 0.98, opacity: 1, rotation: 15, duration: 0.55, ease: "power3.out" },
        3.2
      );

      // "Tagihan manual" (credit-card) @ 4.2s
      tl.fromTo(
        pill3,
        { scale: 0, opacity: 0, rotation: 0 },
        { scale: 1.08, opacity: 1, rotation: -16, duration: 0.55, ease: "power3.out" },
        4.2
      );

      // "Chat menumpuk" (bell) @ 5.3s
      tl.fromTo(
        pill4,
        { scale: 0, opacity: 0, rotation: 0 },
        { scale: 1.02, opacity: 1, rotation: 18, duration: 0.55, ease: "power3.out" },
        5.3
      );

      // Scene 3 (6.5-8.6s): Inward press @ 6.7s ("semuanya datang bersamaan")
      // Entire cluster presses inward toward the card in one cohesive motion
      tl.to(
        wrap1,
        { x: 180, y: 90, duration: 0.65, ease: "power2.out" },
        6.7
      );
      tl.to(
        wrap2,
        { x: -170, y: 85, duration: 0.65, ease: "power2.out" },
        6.7
      );
      tl.to(
        wrap3,
        { x: 190, y: -90, duration: 0.65, ease: "power2.out" },
        6.7
      );
      tl.to(
        wrap4,
        { x: -180, y: -95, duration: 0.65, ease: "power2.out" },
        6.7
      );

      // Center card dims ~20% and compresses slightly under pressure
      tl.to(
        card,
        { opacity: 0.8, scale: 0.95, duration: 0.65, ease: "power2.out" },
        6.7
      );

      // Thin vignette darkens edges to heighten claustrophobia
      tl.fromTo(
        vignette,
        { opacity: 0 },
        { opacity: 0.42, duration: 0.65, ease: "power2.out" },
        6.7
      );

      // Complete stillness hold until end of duration (8.6s) without drift
      tl.to({}, { duration: 0.01 }, 8.6);

      window.__timelines["02-overwhelm"] = tl;
    })();
