  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Elements
      const glowEl = document.getElementById("03-intro-center-glow");
      const arcGuide = document.getElementById("03-intro-arc-guide");
      const markWrap = document.getElementById("03-intro-mark-wrap");
      const wordmarkWrap = document.getElementById("03-intro-wordmark-wrap");
      const subtitleWrap = document.getElementById("03-intro-subtitle-wrap");

      const wpWraps = [
        document.getElementById("03-intro-wp-wrap-1"),
        document.getElementById("03-intro-wp-wrap-2"),
        document.getElementById("03-intro-wp-wrap-3"),
        document.getElementById("03-intro-wp-wrap-4"),
        document.getElementById("03-intro-wp-wrap-5"),
      ];

      const letters = [
        document.getElementById("03-intro-letter-m"),
        document.getElementById("03-intro-letter-a"),
        document.getElementById("03-intro-letter-j"),
        document.getElementById("03-intro-letter-i"),
        document.getElementById("03-intro-letter-k"),
        document.getElementById("03-intro-letter-u"),
      ];

      const role1 = document.getElementById("03-intro-role-1");
      const role2 = document.getElementById("03-intro-role-2");
      const role3 = document.getElementById("03-intro-role-3");

      const orbitItems = document.querySelectorAll("[class~='03-intro-orbit-item']");

      // SVG Paths
      const mainPath = document.getElementById("03-intro-sparkle-main");
      const trV = document.getElementById("03-intro-sparkle-tr-v");
      const trH = document.getElementById("03-intro-sparkle-tr-h");
      const blV = document.getElementById("03-intro-sparkle-bl-v");
      const blH = document.getElementById("03-intro-sparkle-bl-h");
      const allSvgPaths = [mainPath, trV, trH, blV, blH];

      // Measure SVG path lengths for svg-path-draw
      allSvgPaths.forEach((p) => {
        let len = 60;
        try {
          if (typeof p.getTotalLength === "function") {
            const measured = p.getTotalLength();
            if (measured > 0) len = measured;
          }
        } catch (e) {}
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      // Initial states
      gsap.set(markWrap, { x: 0, y: 0, scale: 0.45, opacity: 0 });
      gsap.set(wordmarkWrap, { xPercent: -50 });
      gsap.set(subtitleWrap, { xPercent: -50, y: 30, scale: 0.6, opacity: 0 });
      letters.forEach((el) => {
        gsap.set(el, { y: 36, scale: 0.7, opacity: 0 });
      });

      gsap.set(role1, { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.35, opacity: 0 });
      gsap.set(role2, { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.35, opacity: 0 });
      gsap.set(role3, { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.35, opacity: 0 });

      // Wallpaper pills entrance @ 0.08s
      tl.fromTo(
        wpWraps,
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.7)", stagger: 0.05 },
        0.08
      );

      // --- Scene 1 (0.0–2.3s) ---
      // 1. Orbit with 3D Entry (orbit-3d-entry)
      const RADIUS_X = 330;
      const RADIUS_Y = 165; // Y_TO_X_RATIO: 0.5

      orbitItems.forEach((el, i) => {
        const a0 = (Number(el.dataset.angle) / 360) * Math.PI * 2;
        const startX = Math.cos(a0) * RADIUS_X;
        const startY = Math.sin(a0) * RADIUS_Y;

        // Park at orbital position hidden in 3D
        gsap.set(el, {
          xPercent: -50,
          yPercent: -50,
          x: startX,
          y: startY,
          rotateX: -65,
          rotateY: 45,
          z: -260,
          opacity: 0,
          scale: 0.3,
        });

        // 3D Flip-in in place
        tl.to(
          el,
          {
            rotateX: 0,
            rotateY: 0,
            z: 0,
            opacity: 1,
            scale: 1,
            duration: 0.55,
            ease: "back.out(1.5)",
          },
          0.15 + i * 0.07
        );

        // Continuous orbit
        const orbit = { p: 0 };
        tl.to(
          orbit,
          {
            p: 1,
            duration: 4.2,
            ease: "none",
            onUpdate: () => {
              const a = a0 + orbit.p * Math.PI * 2;
              const x = Math.cos(a) * RADIUS_X;
              const y = Math.sin(a) * RADIUS_Y;
              el.style.zIndex = String(1 + Math.round(((y + RADIUS_Y) / (2 * RADIUS_Y)) * 49));
              el.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
            },
          },
          0.15 + i * 0.07 + 0.55
        );
      });

      // 2. SVG Self-draw + Bloom (svg-path-draw + spring-pop-entrance)
      // Hero visible by t <= 0.5s: starts @ 0.20s, reaches scale 1 @ 0.90s
      tl.to(
        markWrap,
        { scale: 1, opacity: 1, duration: 0.70, ease: "back.out(1.5)" },
        0.20
      );

      // SVG Path draw: main star
      tl.to(
        mainPath,
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
        0.22
      );

      // Cross star paths draw
      tl.to(
        [trV, trH],
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out", stagger: 0.05 },
        0.48
      );
      tl.to(
        [blV, blH],
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out", stagger: 0.05 },
        0.58
      );

      // Main star fill fade-in bloom after stroke completes
      tl.to(
        mainPath,
        { fillOpacity: 1, duration: 0.50, ease: "power1.out" },
        0.85
      );

      // Atmospheric radial glow mencerah @ 0.3–2.2s on "Kenalkan MAJIKU"
      tl.fromTo(
        glowEl,
        { opacity: 0.12, scale: 0.70 },
        { opacity: 0.90, scale: 1.15, duration: 1.90, ease: "power1.out" },
        0.30
      );

      // Orbit satellites fade out smoothly as Scene 2 begins
      tl.to(
        orbitItems,
        { opacity: 0, scale: 0.2, duration: 0.35, ease: "power2.in" },
        2.15
      );

      // --- Scene 2 (2.3–5.2s) ---
      // Mark glides up to header position of lockup
      tl.to(
        markWrap,
        { y: -130, scale: 0.72, duration: 0.55, ease: "power2.inOut" },
        2.25
      );

      // Wordmark "MAJIKU" cascade (logo-brand-close) starting @ 2.4s on "satu platform"
      letters.forEach((letter, i) => {
        tl.to(
          letter,
          { y: 0, scale: 1, opacity: 1, duration: 0.42, ease: "back.out(2.0)" },
          2.40 + i * 0.12
        );
      });

      // Subtitle pill pop @ 3.5s below lockup
      tl.to(
        subtitleWrap,
        { y: 0, scale: 1, opacity: 1, duration: 0.48, ease: "back.out(1.8)" },
        3.50
      );

      // --- Scene 3 (5.2–8.0s) ---
      // Faint dashed guide arc fades in
      tl.to(
        arcGuide,
        { opacity: 1, duration: 0.55, ease: "power1.out" },
        5.15
      );

      // 1. "Lembaga" @ 5.3s (coral) - center-outward expansion
      tl.to(
        role1,
        {
          x: Number(role1.dataset.targetX),
          y: Number(role1.dataset.targetY),
          scale: 1,
          opacity: 1,
          duration: 0.58,
          ease: "back.out(1.6)",
        },
        5.30
      );

      // 2. "Guru" @ 6.3s (mint) - center-outward expansion
      tl.to(
        role2,
        {
          x: Number(role2.dataset.targetX),
          y: Number(role2.dataset.targetY),
          scale: 1,
          opacity: 1,
          duration: 0.58,
          ease: "back.out(1.6)",
        },
        6.30
      );

      // 3. "Orang Tua" @ 7.0s (sky) - center-outward expansion
      tl.to(
        role3,
        {
          x: Number(role3.dataset.targetX),
          y: Number(role3.dataset.targetY),
          scale: 1,
          opacity: 1,
          duration: 0.58,
          ease: "back.out(1.6)",
        },
        7.00
      );

      // Stillness hold until 8.0s (no exit animation)
      tl.to({}, { duration: 0.01 }, 8.0);

      window.__timelines["03-intro"] = tl;
    })();
  </script>
