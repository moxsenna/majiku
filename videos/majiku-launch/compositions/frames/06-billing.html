  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const wallWraps = [
        document.getElementById("06-billing-wall-wrap-1"),
        document.getElementById("06-billing-wall-wrap-2"),
        document.getElementById("06-billing-wall-wrap-3"),
        document.getElementById("06-billing-wall-wrap-4"),
        document.getElementById("06-billing-wall-wrap-5"),
      ];

      const titlePill = document.getElementById("06-billing-title-pill");
      const h1 = document.getElementById("06-billing-h1");
      const triggerCard = document.getElementById("06-billing-trigger-card");
      const progressFill = document.getElementById("06-billing-progress-bar-fill");
      const triggerBtn = document.getElementById("06-billing-trigger-btn");
      const burst = document.getElementById("06-billing-burst");

      const statusPill = document.getElementById("06-billing-status-pill");
      const statusPublishing = document.getElementById("06-billing-status-publishing");
      const statusSent = document.getElementById("06-billing-status-sent");
      const spinner = document.getElementById("06-billing-spinner");

      const invoicePanel = document.getElementById("06-billing-invoice-panel");
      const row1 = document.getElementById("06-billing-row-1");
      const row2 = document.getElementById("06-billing-row-2");
      const row3 = document.getElementById("06-billing-row-3");

      const pendingBadge1 = document.getElementById("06-billing-badge-pending-1");
      const pendingBadge2 = document.getElementById("06-billing-badge-pending-2");
      const pendingBadge3 = document.getElementById("06-billing-badge-pending-3");

      const paidBadge1 = document.getElementById("06-billing-badge-paid-1");
      const paidBadge2 = document.getElementById("06-billing-badge-paid-2");
      const paidBadge3 = document.getElementById("06-billing-badge-paid-3");

      const ring1 = document.getElementById("06-billing-ring-1");
      const ring2 = document.getElementById("06-billing-ring-2");
      const ring3 = document.getElementById("06-billing-ring-3");

      const checkPath1 = document.getElementById("06-billing-check-path-1");
      const checkPath2 = document.getElementById("06-billing-check-path-2");
      const checkPath3 = document.getElementById("06-billing-check-path-3");

      const rekapPill = document.getElementById("06-billing-rekap-pill");

      // Measure SVG check paths for progressive path-draw
      const checkPaths = [checkPath1, checkPath2, checkPath3];
      checkPaths.forEach(function (p) {
        if (p) {
          const len = p.getTotalLength ? p.getTotalLength() : 25;
          p.style.strokeDasharray = len;
          p.style.strokeDashoffset = len;
        }
      });

      // Initial state setup at t=0
      tl.set([statusPill, invoicePanel, row1, row2, row3, rekapPill], { opacity: 0 }, 0);
      tl.set([paidBadge1, paidBadge2, paidBadge3, statusSent], { opacity: 0 }, 0);

      // ==========================================
      // Scene 1 (0.0–2.2s): Trigger Pop & Button Press
      // ==========================================

      // Floating pills wallpaper arrival @ 0.05s
      tl.fromTo(
        wallWraps,
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.7)", stagger: 0.05 },
        0.05
      );

      // Title tag pill entrance @ 0.08s
      tl.fromTo(
        titlePill,
        { y: -16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.5)" },
        0.08
      );

      // Headline entrance @ 0.12s
      tl.fromTo(
        h1,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.12
      );

      // Trigger pill-card pops in @ 0.15s (hero clearly visible by t <= 0.5s)
      tl.fromTo(
        triggerCard,
        { y: 60, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.65, ease: "back.out(1.4)" },
        0.15
      );

      // Progress bar fill animation inside card @ 0.55s
      tl.fromTo(
        progressFill,
        { width: "0%" },
        { width: "100%", duration: 0.8, ease: "power2.out" },
        0.55
      );

      // Button press & release (press-release-spring) @ 1.50s
      // Phase 1: linear compression
      tl.to(
        triggerBtn,
        { scale: 0.91, duration: 0.14, ease: "power1.in" },
        1.50
      );

      // Phase 2: spring release
      tl.to(
        triggerBtn,
        { scale: 1.0, duration: 0.46, ease: "back.out(2.2)" },
        1.64
      );

      // Phase 3: burst expansion behind button
      tl.fromTo(
        burst,
        { scale: 0.85, opacity: 0.85 },
        { scale: 3.2, opacity: 0, duration: 0.55, ease: "power2.out" },
        1.64
      );

      // ==========================================
      // Scene 2 (2.2–5.5s): Status Theater & Invoice Cascade
      // ==========================================

      // Status pill pops in @ 2.35s
      tl.fromTo(
        statusPill,
        { y: 24, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.5)" },
        2.35
      );

      // Arc spinner rotation
      tl.fromTo(
        spinner,
        { rotation: 0 },
        { rotation: 720, duration: 1.25, ease: "linear" },
        2.35
      );

      // Status phrase swap: "Menerbitkan…" -> "Pengingat terkirim ✓" @ 3.60s
      tl.to(
        statusPublishing,
        { opacity: 0, scale: 0.86, duration: 0.18, ease: "power2.in" },
        3.60
      );
      tl.fromTo(
        statusSent,
        { opacity: 0, scale: 0.86 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" },
        3.68
      );
      tl.to(
        statusPill,
        { backgroundColor: "#FCE292", duration: 0.35, ease: "power2.out" },
        3.68
      );

      // Invoice panel enters from right @ 4.05s
      tl.fromTo(
        invoicePanel,
        { x: 70, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        4.05
      );

      // 3 Invoice rows cascade in staggered
      tl.fromTo(
        row1,
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.4)" },
        4.15
      );
      tl.fromTo(
        row2,
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.4)" },
        4.35
      );
      tl.fromTo(
        row3,
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.4)" },
        4.55
      );

      // Success-check badge flips per row (staggered state mutation)
      // Row 1: flips @ 4.75s
      tl.to(
        pendingBadge1,
        { scale: 0.65, opacity: 0, duration: 0.16, ease: "power2.in" },
        4.75
      );
      tl.fromTo(
        paidBadge1,
        { scale: 0.35, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)" },
        4.80
      );
      tl.fromTo(
        ring1,
        { scale: 0.8, opacity: 0.9 },
        { scale: 2.2, opacity: 0, duration: 0.45, ease: "power2.out" },
        4.80
      );
      tl.to(
        checkPath1,
        { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" },
        4.85
      );

      // Row 2: flips @ 5.00s
      tl.to(
        pendingBadge2,
        { scale: 0.65, opacity: 0, duration: 0.16, ease: "power2.in" },
        5.00
      );
      tl.fromTo(
        paidBadge2,
        { scale: 0.35, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)" },
        5.05
      );
      tl.fromTo(
        ring2,
        { scale: 0.8, opacity: 0.9 },
        { scale: 2.2, opacity: 0, duration: 0.45, ease: "power2.out" },
        5.05
      );
      tl.to(
        checkPath2,
        { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" },
        5.10
      );

      // Row 3: flips @ 5.25s
      tl.to(
        pendingBadge3,
        { scale: 0.65, opacity: 0, duration: 0.16, ease: "power2.in" },
        5.25
      );
      tl.fromTo(
        paidBadge3,
        { scale: 0.35, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)" },
        5.30
      );
      tl.fromTo(
        ring3,
        { scale: 0.8, opacity: 0.9 },
        { scale: 2.2, opacity: 0, duration: 0.45, ease: "power2.out" },
        5.30
      );
      tl.to(
        checkPath3,
        { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" },
        5.35
      );

      // ==========================================
      // Scene 3 (5.5–7.4s): Rekap Pill Pop & Climax Settle
      // ==========================================

      // Rekap pill pop @ 5.60s
      tl.fromTo(
        rekapPill,
        { y: 28, opacity: 0, scale: 0.93 },
        { y: 0, opacity: 1, scale: 1, duration: 0.52, ease: "back.out(1.6)" },
        5.60
      );

      // Settle and hold until full duration (no exit animation)
      tl.to({}, { duration: 0.01 }, 7.40);

      window.__timelines["06-billing"] = tl;
    })();
  </script>
