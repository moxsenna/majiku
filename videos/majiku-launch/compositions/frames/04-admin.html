    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const pillWraps = [
        document.getElementById("04-admin-pill-wrap-1"),
        document.getElementById("04-admin-pill-wrap-2"),
        document.getElementById("04-admin-pill-wrap-3"),
        document.getElementById("04-admin-pill-wrap-4"),
        document.getElementById("04-admin-pill-wrap-5"),
      ];

      const labelPill = document.getElementById("04-admin-label-pill");
      const windowCard = document.getElementById("04-admin-window-card");
      const callout1 = document.getElementById("04-admin-callout-1");
      const callout2 = document.getElementById("04-admin-callout-2");
      const callout3 = document.getElementById("04-admin-callout-3");
      const checkPill = document.getElementById("04-admin-check-pill");

      const zoomOuter = document.getElementById("04-admin-zoom-outer");
      const zoomInner = document.getElementById("04-admin-zoom-inner");

      // Initial visibility states to avoid frame 0 flashes
      tl.set([labelPill, callout1, callout2, callout3, checkPill], { opacity: 0 }, 0);

      // Track 1: Wallpaper entrance
      tl.fromTo(
        pillWraps,
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.7)", stagger: 0.05 },
        0.08
      );

      // Scene 1 (0.0–2.2s):
      // Jendela pill-card slide-up lembut@0.0–0.8 pada "Dari satu dashboard admin"
      // Hero visible by t <= 0.5s
      tl.fromTo(
        windowCard,
        { y: 70, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0.0
      );

      // Label pill "DASHBOARD ADMIN" pop di atas jendela@1.6
      tl.fromTo(
        labelPill,
        { scale: 0.5, y: 15, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.42, ease: "back.out(2.2)" },
        1.6
      );

      // Scene 2 (2.2–5.7s):
      // Coordinate Target Zoom parameters
      // Outer scales around 50% 50%, Inner counter-translates: T = -offset
      // W = 1920, H = 1080. Center = (960, 540)
      const W = 1920;
      const H = 1080;
      const ZOOM_SCALE = 1.14;

      function getCounter(el, defX, defY) {
        if (el) {
          const r = el.getBoundingClientRect();
          if (r.width > 0 && r.height > 0) {
            return {
              x: -(r.left + r.width / 2 - W / 2),
              y: -(r.top + r.height / 2 - H / 2),
            };
          }
        }
        return {
          x: -(defX - W / 2),
          y: -(defY - H / 2),
        };
      }

      // Measured or exact target centers
      const c1 = getCounter(callout1, 1460, 182);
      const c2 = getCounter(callout2, 1460, 352);
      const c3 = getCounter(callout3, 1460, 522);

      // Cue 1 @ 2.3s: "Kehadiran real-time · 156/160 siswa" (angka coral)
      tl.fromTo(
        callout1,
        { scale: 0.6, y: 30, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.46, ease: "back.out(1.8)" },
        2.3
      );
      tl.to(zoomOuter, { scale: ZOOM_SCALE, duration: 0.75, ease: "power3.inOut" }, 2.3);
      tl.to(zoomInner, { x: c1.x, y: c1.y, duration: 0.75, ease: "power3.inOut" }, 2.3);

      // Cue 2 @ 3.7s: "Tagihan · Rp 245 jt"
      tl.fromTo(
        callout2,
        { scale: 0.6, y: 30, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.46, ease: "back.out(1.8)" },
        3.7
      );
      tl.to(zoomOuter, { scale: ZOOM_SCALE, duration: 0.75, ease: "power3.inOut" }, 3.7);
      tl.to(zoomInner, { x: c2.x, y: c2.y, duration: 0.75, ease: "power3.inOut" }, 3.7);

      // Cue 3 @ 4.6s: "Laporan & analytics"
      tl.fromTo(
        callout3,
        { scale: 0.6, y: 30, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.46, ease: "back.out(1.8)" },
        4.6
      );
      tl.to(zoomOuter, { scale: ZOOM_SCALE, duration: 0.75, ease: "power3.inOut" }, 4.6);
      tl.to(zoomInner, { x: c3.x, y: c3.y, duration: 0.75, ease: "power3.inOut" }, 4.6);

      // Scene 3 (5.7–7.28s):
