      const tl = gsap.timeline({ paused: true });

      const phoneGlow = document.getElementById("03-parent-phone-glow");
      const phoneWrap = document.getElementById("03-parent-phone-wrap");
      const headlineWrap = document.getElementById("03-parent-headline-wrap");
      const wallWraps = [

      tl.fromTo(
        wallWraps,
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power2.out", stagger: 0.05 },
        0.05
      );

      // Warm peach glow behind phone
      tl.fromTo(
        phoneGlow,
        { scale: 0.78, opacity: 0 },
        { scale: 1, opacity: 1, duration: 1.0, ease: "power2.out" },
        0.0
      );

      // Hero phone rises gently @ 0.0–0.9s (clearly visible by t <= 0.5s)
      tl.fromTo(
        phoneWrap,
        { y: 110, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1.0, duration: 0.9, ease: "power2.out" },
        0.0
      );

      // Headline "Orang tua melihat semua." fades up @ 0.2s
      tl.fromTo(
        headlineWrap,
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power2.out" },
        0.2
      );

      // Scene 2 (1.8–4.5s): Two notification pills pop per VO cue
      // Notification 1: "✓ Aisyah sudah tiba! · 08:15" @ 2.0s (mint, pada "check-in")
      tl.fromTo(
        notif1,
        { scale: 0, opacity: 0, y: 18 },
        { scale: 1, opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
        2.0
      );

      // Notification 2: "Foto kegiatan baru" @ 3.2s (sky, pada "foto")

        notif2,
        { scale: 0, opacity: 0, y: 18 },
        { scale: 1, opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
        3.2
      );

      // HOLD hangat: gentle warmth settle (subtle float until 4.5s, no exit)
      tl.to(
        phoneWrap,
        { y: -8, duration: 1.0, ease: "sine.inOut" },
        3.5
      );
      tl.to(

        { y: -5, duration: 1.0, ease: "sine.inOut" },
        3.5

      tl.to(
