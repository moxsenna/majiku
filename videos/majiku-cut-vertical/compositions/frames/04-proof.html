  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const stageInner = document.getElementById("04-proof-stage-inner");
      const heroGlow = document.getElementById("04-proof-hero-glow");
      const card = document.getElementById("04-proof-card");
      const counter = document.getElementById("04-proof-counter");
      const suffix = document.getElementById("04-proof-suffix");
      const label = document.getElementById("04-proof-label");
      const subpill = document.getElementById("04-proof-subpill");

      const pillWraps = [
        document.getElementById("04-proof-pill-wrap-1"),
        document.getElementById("04-proof-pill-wrap-2"),
        document.getElementById("04-proof-pill-wrap-3"),
        document.getElementById("04-proof-pill-wrap-4"),
        document.getElementById("04-proof-pill-wrap-5"),
        document.getElementById("04-proof-pill-wrap-6"),
      ];

      // Initial visibility states at t=0
      tl.set(card, { opacity: 0, scale: 0.85, y: 30 }, 0);
      tl.set(heroGlow, { opacity: 0, scale: 0.7 }, 0);
      tl.set(suffix, { opacity: 0, y: 24 }, 0);
      tl.set(label, { opacity: 0, scale: 0.85, y: 15 }, 0);
      tl.set(subpill, { opacity: 0, scale: 0.75, y: 20 }, 0);
      tl.set(pillWraps, { opacity: 0, scale: 0.6 }, 0);

      // Subtle macro camera drift across full 3.0s duration
      tl.fromTo(
        stageInner,
        { scale: 1.0 },
        { scale: 1.025, ease: "none", duration: 3.0 },
        0
      );

      // Track 1: Wallpaper pills spring entrance
      tl.fromTo(
        pillWraps,
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.7)", stagger: 0.04 },
        0.04
      );

      // Hero stat card entrance (fully visible by t <= 0.45s)
      tl.fromTo(
        card,
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "back.out(1.6)" },
        0.08
      );

      // Soft glow bloom begins as card lands
      tl.fromTo(
        heroGlow,
        { opacity: 0, scale: 0.7 },
        { opacity: 0.5, scale: 0.9, duration: 0.4, ease: "power2.out" },
        0.1
      );

      // =========================================================================
      // Count-Up 0 -> 500 with dynamic scale (`counting-dynamic-scale`)
      // Starts at t=0.5s on VO cue "lima ratus"
      // =========================================================================
      const counterState = { value: 0 };
      const START_SIZE = 105;
      const END_SIZE = 190;
      const START_SCALE = START_SIZE / END_SIZE;

      // Number text count-up
      tl.to(
        counterState,
        {
          value: 500,
          duration: 1.1,
          ease: "power3.out",
          onUpdate: function () {
            counter.textContent = Math.round(counterState.value).toLocaleString();
          },
        },
        0.5
      );

      // Dynamic scale growth synchronized with count
      tl.fromTo(
        counter,
        { scale: START_SCALE },
        { scale: 1.0, duration: 1.1, ease: "power3.out" },
        0.5
      );

      // Glow blooms dramatically during count-up peak
      tl.to(
        heroGlow,
        { opacity: 0.85, scale: 1.12, duration: 1.1, ease: "power2.out" },
        0.5
      );

      // Suffix "+" slides/pops in right after count completes at 1.6s
      tl.fromTo(
        suffix,
        { opacity: 0, y: 24, scale: 0.7 },
        { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "back.out(1.8)" },
        1.6
      );

      // =========================================================================
      // Label "LEMBAGA AKTIF" pop@1.8s
      // =========================================================================
      tl.fromTo(
        label,
        { opacity: 0, scale: 0.85, y: 15 },
        { opacity: 1, scale: 1, y: 0, duration: 0.38, ease: "back.out(1.7)" },
        1.8
      );

      // =========================================================================
      // Sub-pill "25K+ SISWA TERKELOLA" pop kecil@2.4s pada "memakainya"
      // =========================================================================
      tl.fromTo(
        subpill,
        { opacity: 0, scale: 0.75, y: 20 },
        { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(1.9)" },
        2.4
      );

      // Settle glow slightly into hold
      tl.to(
        heroGlow,
        { opacity: 0.7, scale: 1.05, duration: 0.5, ease: "power1.out" },
        2.4
      );

      // Hold to 3.0s (full duration anchor)
      tl.to({}, { duration: 0.01 }, 3.0);

      window.__timelines["04-proof"] = tl;
    })();
