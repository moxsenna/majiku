<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FFFFFF; }
  @font-face {
    font-family: "Plus Jakarta Sans";
    font-style: normal;
    font-weight: 400;
    font-display: block;
    src: url("assets/fonts/plus-jakarta-sans-400.woff2") format("woff2");
  }
  @font-face {
    font-family: "Plus Jakarta Sans";
    font-style: normal;
    font-weight: 600;
    font-display: block;
    src: url("assets/fonts/plus-jakarta-sans-600.woff2") format("woff2");
  }
  @font-face {
    font-family: "Plus Jakarta Sans";
    font-style: normal;
    font-weight: 700;
    font-display: block;
    src: url("assets/fonts/plus-jakarta-sans-700.woff2") format("woff2");
  }
  #root {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background-color: #FFFFFF;
    container-type: size;
    font-family: "Plus Jakarta Sans", sans-serif;
  }
  .cta-atmo {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 16%, rgba(247, 176, 158, 0.16) 0%, transparent 44%),
      radial-gradient(circle at 82% 80%, rgba(252, 226, 146, 0.18) 0%, transparent 46%);
  }
  .cta-card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 76cqw;
    padding: 60px 56px 52px;
    border-radius: 2rem;
    border: 3px solid #1E1E1E;
    background-color: #FFFFFF;
    box-shadow: 12px 12px 0 rgba(26, 26, 26, 0.10);
    text-align: center;
    opacity: 0;
    scale: 0.92;
  }
  .cta-lockup {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 16px;
  }
  .cta-mark { width: 54px; height: 54px; display: block; }
  .cta-wordmark {
    font-size: 54px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #32221B;
    line-height: 1;
  }
  .cta-tagline {
    font-size: 26px;
    font-weight: 600;
    color: #32221B;
    margin-bottom: 24px;
    line-height: 1.4;
  }
  .cta-button {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 22px 46px;
    border-radius: 9999px;
    border: 3px solid #1E1E1E;
    background-color: #F06542;
    color: #FFFFFF;
    font-size: 28px;
    font-weight: 700;
    box-shadow: 8px 8px 0 rgba(26, 26, 26, 0.12);
    opacity: 0;
    scale: 0.9;
  }
  .cta-note {
    margin-top: 22px;
    display: inline-block;
    padding: 10px 24px;
    border-radius: 9999px;
    border: 2.5px solid #1E1E1E;
    background-color: #FCE292;
    color: #32221B;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0;
  }
</style>
</head>
<body>
  <div
    id="root"
    data-composition-id="99-cta-card"
    data-start="0"
    data-duration="2.5"
    data-width="1080"
    data-height="1920"
  >
    <div class="cta-atmo"></div>
    <div class="cta-card" id="hk-card">
      <div class="cta-lockup">
        <img class="cta-mark" src="assets/logo-65fc9c68.svg" alt="MAJIKU">
        <span class="cta-wordmark">MAJIKU</span>
      </div>
      <div class="cta-tagline">Kelola lembaga pendidikan Anda<br>dengan lebih mudah.</div>
      <div class="cta-button" id="hk-btn"><span>✦ Coba Gratis 14 Hari</span></div>
      <div><span class="cta-note" id="hk-note">Tanpa kartu kredit · Setup 5 menit</span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#hk-card",
        { opacity: 0, scale: 0.92, y: 20 },
        { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.2
      );
      tl.fromTo(
        "#hk-btn",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        0.8
      );
      tl.fromTo(
        "#hk-note",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.3
      );
      window.__timelines = window.__timelines || {};
      window.__timelines["99-cta-card"] = tl;
    })();
  </script>
</body>
</html>
