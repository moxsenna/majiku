  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["02-intro"] = tl;

      // 1. Measure SVG paths for svg-path-draw
      const drawPaths = document.querySelectorAll(".f02-draw-path");
      drawPaths.forEach((p) => {
        let len = 60;
        try {
          len = p.getTotalLength() || 60;
        } catch (e) {
          len = 60;
        }
        p.style.strokeDasharray = `${len}`;
        p.style.strokeDashoffset = `${len}`;
      });

      // Atmospheric radial glows breathe up slightly
      tl.fromTo(
        [".f02-glow-1", ".f02-glow-2", ".f02-glow-3"],
        { opacity: 0.4 },
        { opacity: 1, duration: 1.8, ease: "power1.out" },
        0
      );

      // Floating background pills enter softly
      tl.fromTo(
        ".f02-floating-pill",
        { opacity: 0, scale: 0.6 },
        { opacity: 0.85, scale: 1, duration: 0.8, stagger: 0.08, ease: "back.out(1.4)" },
        0.1
      );

      // Hero Center Pop (t=0.1)
      tl.fromTo(
        ".f02-orbit-center",
        { opacity: 0, scale: 0.5 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" },
        0.1
      );

      // Main Sparkle stroke draw (t=0.15)
      tl.to(
        ".f02-sparkle-main",
        { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" },
        0.15
      );

      // Sub Sparkles stroke draw (t=0.6)
      tl.to(
        ".f02-sparkle-sub",
        { strokeDashoffset: 0, duration: 0.4, stagger: 0.06, ease: "power2.out" },
        0.6
      );

      // Sparkle fill fade-in & glow ignite (t=0.8)
      tl.to(
        ".f02-sparkle-main",
        { fillOpacity: 1, duration: 0.4, ease: "power1.out" },
        0.8
      );
      tl.to(
        ".f02-mark-glow",
        { opacity: 0.85, scale: 1.25, duration: 0.7, ease: "power2.out" },
        0.8
      );

      // Orbit 3D Entry & continuous orbit
      const orbitItems = document.querySelectorAll(".f02-orbit-item");
      const RADIUS_X = 220;
      const RADIUS_Y = 95;
      const ORBIT_DURATION = 10;
      const ENTRY_DUR = 0.6;
      const STAGGER = 0.08;

      orbitItems.forEach((el, i) => {
        const a0 = (Number(el.dataset.angle) / 360) * Math.PI * 2;
        const startX = Math.cos(a0) * RADIUS_X;
        const startY = Math.sin(a0) * RADIUS_Y;

        // 1) Park at orbital position, hidden
        gsap.set(el, {
          xPercent: -50,
          yPercent: -50,
          x: startX,
          y: startY,
          rotateX: 75,
          rotateY: 60,
          z: -260,
          opacity: 0,
          scale: 0.4
        });

        // 2) Flip in IN PLACE
        tl.to(
          el,
          {
            rotateX: 0,
            rotateY: 0,
            z: 0,
            opacity: 1,
            scale: 1,
            duration: ENTRY_DUR,
            ease: "back.out(1.5)"
          },
          0.25 + i * STAGGER
        );

        // 3) Continuous orbit progress
        const orbit = { p: 0 };
        tl.to(
          orbit,
          {
            p: 1,
            duration: ORBIT_DURATION,
            ease: "none",
            onUpdate: () => {
              const a = a0 + orbit.p * Math.PI * 2;
              const x = Math.cos(a) * RADIUS_X;
              const y = Math.sin(a) * RADIUS_Y;
              el.style.zIndex = String(1 + Math.round(((y + RADIUS_Y) / (2 * RADIUS_Y)) * 49));
              gsap.set(el, { x, y });
            }
          },
          0.25 + i * STAGGER + ENTRY_DUR
        );
      });

      // Wordmark "MAJIKU" cascade (t=1.0 - 1.5)
      tl.fromTo(
        ".f02-letter",
        { opacity: 0, y: 35, scale: 0.5, rotate: -6 },
        { opacity: 1, y: 0, scale: 1, rotate: 0, duration: 0.45, stagger: 0.08, ease: "back.out(1.8)" },
        1.0
      );

      // Subtitle Pill pop (t=2.3)
      tl.fromTo(
        ".f02-subtitle-pill",
        { opacity: 0, scale: 0.5, y: 22 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" },
        2.3
      );

      // Scene 2: Tiga Pill Peran column pop (t=3.4, 4.0, 4.5)
      tl.fromTo(
        ".f02-role-1",
        { opacity: 0, y: 55, scale: 0.88 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" },
        3.4
      );

      tl.fromTo(
        ".f02-role-2",
        { opacity: 0, y: 55, scale: 0.88 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" },
        4.0
      );

      tl.fromTo(
        ".f02-role-3",
        { opacity: 0, y: 55, scale: 0.88 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" },
        4.5
      );

      tl.seek(0);
    })();
  </script>
